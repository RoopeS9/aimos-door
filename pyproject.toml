[project]
name = "aimos-door"
version = "0.1.0"
description = "An open purchasing door with buyer-signed limits"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "python-dotenv>=1.0", "PyJWT[crypto]>=2.9", "ijson>=3.3", "psutil>=6.0"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
mcp = [
    "mcp>=2.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: running server and real upstream API/model"]

[tool.uv]
package = false
default-groups = ["dev", "mcp"]
